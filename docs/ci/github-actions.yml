# Hephaestus — GitHub Actions workflow (copy into .github/workflows/api-tests.yml)
#
# Runs a Postman collection through Newman, then gates the build. Every
# Hephaestus command exits 1 when its gate trips, so a plain `run:` step is
# enough — no output parsing.
#
# Adjust: COLLECTION / ENVIRONMENT paths, the SLA budget, the coverage floor.

name: API tests

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # nightly regression

env:
  COLLECTION: collection/api-tests.postman_collection.json
  ENVIRONMENT: env/staging.postman_environment.json
  SLA_MS: "500"          # p95 budget
  COVERAGE_MIN: "80"     # % of the OpenAPI spec the collection must cover

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman + Hephaestus
        run: |
          npm install -g newman
          # From a clone of the framework. Once published: npx hephaestus <cmd>
          git clone --depth 1 https://github.com/bogdanov-igor/hephaestus-postman-framework.git .hephaestus

      # Engine integrity, version drift, required env vars — before spending time
      # on the run itself.
      - name: Pre-flight
        run: node .hephaestus/bin/hephaestus.js doctor -e "$ENVIRONMENT"

      # Do not fail here: let the gates below report first. The assertion failure
      # is re-raised by the summary gate.
      - name: Run collection
        run: |
          newman run "$COLLECTION" -e "$ENVIRONMENT" -r cli,json \
            --reporter-json-export results.json || true

      - name: Summary + latency gate
        run: node .hephaestus/bin/hephaestus.js summary results.json --sla=$SLA_MS --history

      - name: Regression gate
        if: hashFiles('baseline.json') != ''
        run: node .hephaestus/bin/hephaestus.js compare baseline.json results.json

      - name: Spec coverage gate
        if: hashFiles('openapi.yaml') != ''
        run: node .hephaestus/bin/hephaestus.js coverage --spec openapi.yaml "$COLLECTION" --min $COVERAGE_MIN

      - name: HTML report
        if: always()
        run: node .hephaestus/bin/hephaestus.js report results.json report.html

      - name: JUnit for the Checks tab
        if: always()
        run: node .hephaestus/bin/hephaestus.js junit results.json junit.xml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-results
          path: |
            results.json
            report.html
            junit.xml
          retention-days: 30
