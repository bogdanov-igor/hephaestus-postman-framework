# npm publish via Trusted Publishing (OIDC) — MANUAL trigger only.
#
# No npm token is stored anywhere. GitHub Actions proves the workflow's identity
# to npm over OIDC, so publishing works without a secret — which is also why npm
# attaches provenance attestations automatically.
#
# ONE-TIME SETUP on npmjs.com (already-published package → Settings → Trusted
# Publisher → GitHub Actions):
#
#     Organization or user : bogdanov-igor
#     Repository           : hephaestus-postman-framework
#     Workflow filename    : publish.yml
#     Environment          : (leave empty)
#     Allowed actions      : npm publish
#
# Then: Actions → "npm publish" → Run workflow. dry_run=true rehearses without
# publishing; set it to false to publish for real.
#
# Requirements npm enforces for OIDC: npm CLI >= 11.5.1 and Node >= 22.14.0 —
# hence the Node 22 pin and the explicit npm upgrade below.

name: npm publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse without publishing (npm publish --dry-run)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required: lets GitHub mint the OIDC token npm verifies

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # OIDC needs >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to an OIDC-capable version
        # Node 22 ships npm 10.x; trusted publishing landed in 11.5.1.
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      - name: Install dev dependencies
        run: npm install

      - name: Gate — build + tests must pass before publishing
        run: |
          npm run build
          npm test

      - name: Refuse to re-publish an existing version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "Package: $NAME@$VER"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "❌ $NAME@$VER is already on npm — bump the version first."
            exit 1
          fi
          echo "✅ $NAME@$VER is not yet published."

      - name: Publish (dry-run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish (real, via OIDC — no token)
        if: ${{ !inputs.dry_run }}
        run: |
          # setup-node writes _authToken=${NODE_AUTH_TOKEN} into its npmrc and
          # exports a placeholder for that variable. Left in place, npm sends the
          # placeholder as credentials and never reaches the OIDC path.
          for F in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc" "$RUNNER_TEMP/.npmrc" ./.npmrc; do
            [ -n "$F" ] && [ -f "$F" ] && sed -i '/_authToken/d' "$F" && echo "stripped token line from $F"
          done
          echo "npm $(npm --version) / node $(node --version)"
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO — id-token permission missing}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"
          npm publish --access public
